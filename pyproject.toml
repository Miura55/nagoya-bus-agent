[project]
name = "nagoya-bus-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore>=1.4.7",
    "bedrock-agentcore-starter-toolkit>=0.3.3",
    "botocore[crt]>=1.42.73",
    "nagoya-bus-mcp==0.6.0",
    "botocore[crt]>=1.41.1",
    "pandas>=2.3.3",
    "strands-agents>=1.17.0",
    "streamlit>=1.55.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
exclude = ["frontend*"]
