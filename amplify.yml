version: 1
computeType: BUILD_GENERAL1_LARGE
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@8 --activate
        - cd frontend && pnpm install --frozen-lockfile
    build:
      commands:
        - NODE_OPTIONS=--max-old-space-size=7168 pnpm build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
