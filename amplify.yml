version: 1
computeType: BUILD_GENERAL1_LARGE
frontend:
  phases:
    preBuild:
      commands:
        # Node.js heap を Large インスタンスの推奨値に設定（pnpm install にも適用）
        - export NODE_OPTIONS='--max-old-space-size=12000'
        - corepack enable
        - corepack prepare pnpm@8 --activate
        # フロントエンドビルドに不要な巨大 CDK 系パッケージを除いてインストール
        - cd frontend && rm -rf node_modules
        - pnpm install --frozen-lockfile
        # aws-cdk-lib / constructs はビルド不要のため削除してメモリを解放
        - pnpm remove --no-save aws-cdk-lib constructs @aws-amplify/backend @aws-amplify/backend-cli || true
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
